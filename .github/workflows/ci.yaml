name: CI

on:
  push:
    paths:
      - "src/**"
      - .github/workflows/ci.yaml

permissions:
  contents: write

jobs:
  src-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "src/go.mod"
      - id: run-src-tests
        name: Run SRC tests
        run: |
          cd src 
          go test -v  ./...
      - name: Cross-compile Windows binaries
        run: |
          cd src
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o ../dist/action-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o ../dist/action-windows-arm64.exe .
